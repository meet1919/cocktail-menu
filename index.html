<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sip Happens</title>
  <meta name="description" content="Four hand-made cocktails, built glass by glass as you scroll.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-loading">

  <div id="preloader" role="status" aria-live="polite">
    <svg id="loader-glass" viewBox="0 0 200 300" aria-hidden="true"></svg>
    <p class="loader-label">Pouring… <span id="loader-pct">0</span>%</p>
  </div>

  <main class="menu">
    <div class="stage">
      <div class="glow"></div>
      <svg id="stage-glass" viewBox="0 0 200 300" aria-hidden="true"></svg>
    </div>

    <div class="content">
      <header class="hero">
        <span class="hero-bg" aria-hidden="true">SIP</span>
        <p class="eyebrow">Cocktail menu</p>
        <h1>Sip Happens</h1>
        <p class="hero-tag">Four drinks, made fresh. Scroll to watch each one come together.</p>
        <div class="scroll-hint" aria-hidden="true"><span>Scroll</span><i></i></div>
      </header>
      <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>
      <div class="drinks" id="drinks"></div>
    </div>
  </main>

  <footer class="footer">
    <p class="cheers">Cheers!</p>
    <p class="footer-note">Please drink responsibly.</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/svg.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/scroll.js"></script>
  <script src="js/preloader.js"></script>
  <script src="js/load3d.js"></script>
  <script src="js/type.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
