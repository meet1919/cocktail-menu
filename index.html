<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sip Happens</title>
  <meta name="description" content="Four hand-made cocktails, built glass by glass as you scroll.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-loading">

  <div id="preloader" role="status" aria-live="polite">
    <svg id="loader-glass" viewBox="0 0 200 300" aria-hidden="true"></svg>
    <p class="loader-label">Pouring… <span id="loader-pct">0</span>%</p>
  </div>

  <main class="menu">
    <div class="stage">
      <div class="glow"></div>
      <svg id="stage-glass" viewBox="0 0 200 300" aria-hidden="true"></svg>
    </div>

    <div class="content">
      <header class="hero">
        <p class="eyebrow">Cocktail menu</p>
        <h1>Sip Happens</h1>
        <p class="hero-tag">Four drinks, made fresh. Scroll to watch each one come together.</p>
        <div class="hero-cta">
          <button class="browse-btn" id="browse-open" type="button" aria-haspopup="dialog" aria-controls="browse">
            <span class="bb-liquid" aria-hidden="true">
              <svg class="bb-wave" viewBox="0 0 160 12" preserveAspectRatio="none"><path d="M0,6 q20,-6 40,0 t40,0 q20,-6 40,0 t40,0 V12 H0Z"/></svg>
              <i class="bb-body"></i>
            </span>
            <svg class="bb-glass" viewBox="0 0 24 34" aria-hidden="true">
              <path class="bb-glass-liq" d="M4.4,16 q3.2,-2.4 7.6,0 t7.4,0 L18.4,32 H5.6Z"/>
              <path class="bb-glass-line" d="M3,3 H21 L18.4,32 H5.6Z"/>
            </svg>
            <span class="bb-label">Browse the full bar</span>
            <span class="bb-count" id="browse-count" aria-hidden="true"></span>
          </button>
        </div>
        <div class="scroll-hint" aria-hidden="true"><span>Scroll</span><i></i></div>
      </header>
      <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>
      <div class="drinks" id="drinks"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="cheers-stage" id="cheers-stage" aria-hidden="true" hidden></div>
    <p class="cheers">Cheers!</p>
    <button class="pill cheers-again" id="cheers-again" type="button" hidden>Clink again</button>
    <p class="footer-note">Please drink responsibly.</p>
  </footer>

  <div id="browse" class="browse" role="dialog" aria-modal="true" aria-labelledby="browse-title" hidden>
    <div class="browse-backbar" aria-hidden="true">
      <div class="browse-bottles">
        <i class="browse-bottle"></i><i class="browse-bottle"></i><i class="browse-bottle"></i>
        <i class="browse-bottle"></i><i class="browse-bottle"></i><i class="browse-bottle"></i>
        <i class="browse-bottle"></i><i class="browse-bottle"></i><i class="browse-bottle"></i>
        <i class="browse-bottle"></i><i class="browse-bottle"></i><i class="browse-bottle"></i>
      </div>
    </div>
    <div class="browse-inner">
      <header class="browse-head">
        <div>
          <p class="eyebrow">Every pour</p>
          <h2 id="browse-title" tabindex="-1">The Full Bar</h2>
        </div>
        <button class="pill browse-close" id="browse-close" type="button" aria-label="Close the full bar">
          <span aria-hidden="true">Close</span><i aria-hidden="true"></i>
        </button>
      </header>
      <div class="browse-filters" id="browse-filters" role="group" aria-label="Filter by spirit"></div>
      <section class="browse-stage" aria-label="Cocktails on the bar">
        <div class="browse-counter" aria-hidden="true"></div>
        <div class="browse-grid" id="browse-grid" role="group" aria-label="Cocktails on one counter. Scroll horizontally for more drinks."></div>
        <p class="browse-scroll-hint">Scroll sideways for more drinks <span aria-hidden="true">→</span></p>
      </section>
    </div>
    <div class="browse-detail" id="browse-detail" role="region" aria-live="polite" hidden></div>
  </div>

  <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false" aria-label="Turn sound on">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="st-body" d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/>
      <path class="st-wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/>
      <path class="st-slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>

  <div id="pour" class="pour" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <path id="pour-back"/>
      <path id="pour-front"/>
    </svg>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/svg.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/scroll.js"></script>
  <script src="js/preloader.js"></script>
  <script src="js/load3d.js"></script>
  <script src="js/type.js"></script>
  <script src="js/browse.js"></script>
  <script src="js/cheers.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
